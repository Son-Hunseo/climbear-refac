# prerequisite:
# - server 측 리소스들이 배포되어 있어야 함
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: climbear # 나중에 환경 분리 생각해서 climbear-prod 로 바꾸던지..

resources:
  - ../../base
  - external-secret.yaml

images:
  - name: climbear-ai-image
    newName: 211125633965.dkr.ecr.ap-northeast-2.amazonaws.com/refac/climbear-ai
    newTag: v0.0

patches:
  - target:
      kind: Deployment
      name: refac-climbear-ai
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value: [{name: ecr-registry-key}]
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value: [{secretRef: {name: climbear-ai-secret}}]
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/tolerations
        value: [{key: app, operator: Equal, value: ai, effect: NoSchedule}]
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {app: ai}