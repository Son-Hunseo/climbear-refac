# prerequisite:
# - server 측 리소스들이 배포되어 있어야 함

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: climbear # 나중에 환경 분리 생각해서 climbear-prod 로 바꾸던지..

# base 인줄 알았는데, deprecated되고 resources로 통합됨.
resources:
  - ../../base

images:
  - name: climbear-gateway-image
    newName: 211125633965.dkr.ecr.ap-northeast-2.amazonaws.com/refac/climbear-gateway
    newTag: 0.2

patches:
  - target:
      kind: Deployment
      name: refac-climbear-gateway
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value: [{name: ecr-registry-key}]
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value: [{secretRef: {name: climbear-k8s-secret}}]